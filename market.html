<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/market.css">
    <title>Автосалон</title>
</head>
<body>
    <header>
        <div class="container">
            <h1>Автосалон</h1>
            <nav>
                <ul>
                    <li><a href="#">Лицензии</a></li>
                    <li><a href="#">О нас</a></li>
                    <li><a href="#">Контакты</a></li>
                </ul>
            </nav>
            <div class="cart-icon">
                <button onclick="toggleCart()">🛒 Гараж (<span id="cart-count">0</span>)</button>
            </div>
        </div>
    </header>

    <section class="products">
        <div class="container">
            <div class="product" data-id="1" data-name="nissan gtr" data-price="9000">
                <img src="https://via.placeholder.com/200" alt="Car 1">
                <h3>Nissan GTR(2023)</h3>
                <p>В черном кузове,пробег:2000км</p>
                <p class="price">9000$</p>
                <button class="buy-btn" onclick="addToCart(this)">Купить</button>
            </div>
            <div class="product"data-id="2" data-name="lamborgini" data-price="8000">
                <img src="https://via.placeholder.com/200" alt="Car 2">
                <h3>Lamborgini(2024)</h3>
                <p>В черном кузове,пробег:2000км</p>
                <p class="price">8000$</p>
                <button class="buy-btn" onclick="addToCart(this)">Купить</button>
            </div>
            <div class="product"data-id="3" data-name="bmw m5" data-price="6999">
                <img src="https://via.placeholder.com/200" alt="Car 3">
                <h3>BMW M5 F90(2022)</h3>
                <p>В черном кузове,пробег:2000км</p>
                <p class="price">6999$</p>
                <button class="buy-btn" onclick="addToCart(this)">Купить</button>
            </div>
        </div>
    </section>
    <div id="cart" class="cart">
        <h2>Гараж</h2>
        <ul id="cart-items">
        </ul>
        <p id="cart-total">Итого: ₽ 0</p>
        <button onclick="clearCart()">Очистить Гараж</button>
        <button onclick="checkout()">Оформить заказ</button>
        <button onclick="toggleCart()">Закрыть</button>
    </div>
    <footer>
        <div class="container">
            <p>&copy; Basytovvvcars</p>
        </div>
    </footer>  

    <script src="script.js"></script>
</body>
</html>
